version: '3.9'

services:
  backend-rag:
    build:
      context: ./back-end
    ports:
      - "8000:8000"
    env_file:
      - ./back-end/.env
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./database:/app/database

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./front-end:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend-rag
